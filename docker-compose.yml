version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflow_template.json:/home/node/n8n_workflow_template.json

volumes:
  n8n_data: